[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:frankenphp]
command=/usr/local/bin/frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Pulls raw envelopes from Redis and bulk-inserts into ClickHouse.
[program:ingest]
command=php /app/artisan loggerxo:ingest --max-time=3600
numprocs=%(ENV_INGEST_WORKERS)s
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Alerts, e-mails, Telegram, housekeeping jobs.
[program:queue]
command=php /app/artisan queue:work redis --sleep=2 --tries=3 --max-time=3600 --queue=alerts,default
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c "while true; do php /app/artisan schedule:run --no-interaction >> /dev/stdout 2>&1; sleep 60; done"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
